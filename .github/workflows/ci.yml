name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run ESLint
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test with 100% coverage per file
        run: npm run test:coverage
      - name: Build production application
        run: npm run build
      - name: Upload frontend coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: Backend tests and 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: coverage
          POSTGRES_PASSWORD: coverage-ci-only
          POSTGRES_DB: product_management_coverage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coverage -d product_management_coverage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TZ: UTC
      PRODUCT_MANAGEMENT_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/product_management_coverage
      PRODUCT_MANAGEMENT_TEST_DATABASE_USER: coverage
      PRODUCT_MANAGEMENT_TEST_DATABASE_PASSWORD: coverage-ci-only
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify tests and 100% coverage per class
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Upload backend coverage and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-and-tests
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
